[package]
name = "palimpsest"
version = "0.1.0"
description = "Your repositories, standing as a city"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
ureq = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
