<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palimpsest</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #090b12; color: #ece6da; overflow: hidden; }
      body { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
      #city { position: fixed; inset: 0; }
      #city canvas { display: block; }
      #veil {
        position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
        background: #090b12; color: #8d877c; transition: opacity 1.2s;
        font-family: 'Newsreader', 'Iowan Old Style', Georgia, serif; font-style: italic; font-size: 18px;
      }
      #veil.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="city"></div>
    <div id="veil">Pouring concrete</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
