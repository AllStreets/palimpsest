<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Palimpsest tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07080a; color: #ece6da; overflow: hidden; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #veil { position: fixed; inset: 0; background: #07080a; display: grid; place-items: center; transition: opacity 1.2s; z-index: 5; font-family: 'Newsreader', serif; font-style: italic; color: #8d877c; font-size: 18px; }
  .title { position: fixed; top: 26px; left: 30px; pointer-events: none; text-shadow: 0 1px 12px #0008; }
  .title h1 { font-family: 'Newsreader', serif; font-weight: 400; font-size: 32px; letter-spacing: -0.01em; }
  .title p { font-size: 13.5px; color: #c9c1b3; margin-top: 4px; max-width: 520px; line-height: 1.5; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .lab { position: absolute; display: flex; align-items: center; gap: 10px; transform: translateY(-50%); transition: opacity .3s; }
  .lab i { display: block; width: 64px; height: 1px; background: linear-gradient(90deg, #ece6da00, #ece6da99); }
  .lab b { display: block; width: 5px; height: 5px; border-radius: 50%; background: #ece6da; box-shadow: 0 0 0 3px #ece6da22; }
  .lab div { font-size: 12.5px; line-height: 1.35; text-shadow: 0 1px 8px #000c; white-space: nowrap; }
  .lab div em { font-family: 'Newsreader', serif; font-style: normal; font-size: 16px; display: block; color: #f4efe6; }
  .lab div span { color: #b9b1a3; }
  .lab.scar div em { color: #e8a58a; }
  .lab.live div em { color: #f2c46d; }
  .dock { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: stretch; background: rgba(12,13,16,.72); backdrop-filter: blur(14px); border: 1px solid #2c2e33; border-radius: 8px; overflow: hidden; }
  .dock button { all: unset; cursor: pointer; padding: 11px 18px; font-size: 13px; color: #aaa396; border-right: 1px solid #2c2e33; position: relative; }
  .dock button:last-child { border-right: 0; }
  .dock button:hover { color: #ece6da; }
  .dock button.on { color: #f4efe6; background: #1b1c20; }
  .dock button .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: #d9b26a; width: 0; }
  .dock .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8b857a; padding: 11px 16px; border-right: 1px solid #2c2e33; display: flex; align-items: center; }
  .note { position: fixed; right: 30px; bottom: 32px; font-size: 12px; color: #7f796f; text-align: right; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="veil">Pouring concrete…</div>
<div class="title">
  <h1>Palimpsest</h1>
  <p>One agent's tower, read bottom to top. Its root comes from its lineage, each floor is a merged PR, and the era of each floor shows how good the agent was when it laid it.</p>
</div>
<div class="labels" id="labels"></div>
<div class="dock" id="dock">
  <div class="mono">issue #318 · bid $4.20</div>
  <button data-s="0">Bid won<span class="bar"></span></button>
  <button data-s="1">Framing<span class="bar"></span></button>
  <button data-s="2">Inspection<span class="bar"></span></button>
  <button data-s="3">Cured<span class="bar"></span></button>
</div>
<div class="note">Mockup data. Drag to orbit, scroll to zoom.<br>L toggles labels.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const F = n => '/files/' + n;
const W = () => innerWidth, H = () => innerHeight;

// ---------------- renderer, scene, camera ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x58434c, 0.0012);
const camera = new THREE.PerspectiveCamera(36, W()/H(), 0.5, 20000);
camera.position.set(215, 4, 265);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 96, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.6;
controls.minDistance = 30; controls.maxDistance = 600;
controls.autoRotate = true; controls.autoRotateSpeed = 0.18;

const pmrem = new THREE.PMREMGenerator(renderer);
const texLoader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// ---------------- materials ----------------
function tex(name, srgb) {
  const t = texLoader.load(F(name));
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function pbr(prefix, extra = {}) {
  const arm = tex(prefix + '_arm.jpg');
  return new THREE.MeshStandardMaterial(Object.assign({
    map: tex(prefix + '_diff.jpg', true), normalMap: tex(prefix + '_nor.jpg'),
    aoMap: arm, roughnessMap: arm, metalnessMap: arm, roughness: 1, metalness: 0,
  }, extra));
}
const M = {
  sand: pbr('sand', { color: 0xf3e9da }),
  brick: pbr('brick', { color: 0xd8c4b8 }),
  pave: pbr('pave', { color: 0x8a8580, roughness: 0.55, normalScale: new THREE.Vector2(0.8, 0.8) }),
  brushed: pbr('metal', { color: 0xd5d8dc, metalness: 1, roughness: 0.55 }),
  primer: pbr('rust', { color: 0xb8553a, metalness: 0.35 }),
  bronze: new THREE.MeshStandardMaterial({ color: 0x3a2f26, metalness: 1, roughness: 0.38 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x1e2125, metalness: 1, roughness: 0.42 }),
  titanium: new THREE.MeshPhysicalMaterial({ color: 0xc9ccd1, metalness: 1, roughness: 0.22, clearcoat: 0.3 }),
  craneYellow: new THREE.MeshStandardMaterial({ color: 0x9c7414, metalness: 0.4, roughness: 0.5 }),
  concrete: new THREE.MeshStandardMaterial({ color: 0x8e8b86, roughness: 0.9 }),
  cable: new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.4 }),
  netting: null,
  glass: new THREE.MeshPhysicalMaterial({ color: 0x0c1418, metalness: 0.15, roughness: 0.035, transparent: true, opacity: 0.42,
    envMapIntensity: 2.2, clearcoat: 1, clearcoatRoughness: 0.02, ior: 1.5, specularIntensity: 1 }),
  winGlass: new THREE.MeshPhysicalMaterial({ color: 0x111619, metalness: 0.2, roughness: 0.05, envMapIntensity: 1.8, clearcoat: 1 }),
};

M.netting = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.clearRect(0, 0, 64, 64); g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.2;
  for (let i = 0; i <= 64; i += 8) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(64, i); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 6);
  return new THREE.MeshStandardMaterial({ color: 0x1f3a33, alphaMap: t, transparent: true, opacity: 0.85, side: THREE.DoubleSide, roughness: 0.95, depthWrite: false });
})();
// world-scale UVs on boxes so tiled textures keep real size (scale = metres per tile)
function box(w, h, d, mat, scale = 3) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f*4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / scale, uv.getY(i) * dims[f][1] / scale);
  }
  g.setAttribute('uv2', uv.clone());
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
}
function inst(geo, mat, n) { const m = new THREE.InstancedMesh(geo, mat, n); m.castShadow = m.receiveShadow = true; return m; }
const dummy = new THREE.Object3D();
function setI(m, i, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, rx = 0, rz = 0) {
  dummy.position.set(x, y, z); dummy.scale.set(sx, sy, sz); dummy.rotation.set(rx, ry, rz);
  dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix);
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// office interior texture: ceiling light rows, desks, varied occupancy
function interiorTex(floors, warmth, density, s0) {
  seed = s0;
  const c = document.createElement('canvas'); c.width = 1024; c.height = floors * 64;
  const g = c.getContext('2d');
  for (let f = 0; f < floors; f++) {
    const y = f * 64;
    const occupied = rnd() < density;
    const grd = g.createLinearGradient(0, y, 0, y + 64);
    grd.addColorStop(0, '#000'); grd.addColorStop(0.08, occupied ? '#2a2420' : '#08090a');
    grd.addColorStop(0.7, occupied ? '#120f0d' : '#050506'); grd.addColorStop(1, '#000');
    g.fillStyle = grd; g.fillRect(0, y, 1024, 64);
    if (!occupied) continue;
    for (let x = 0; x < 1024; x += 128) {
      if (rnd() < 0.18) continue;
      const k = 0.55 + rnd() * 0.45;
      const [r, gg, b] = warmth ? [255, 214, 160] : [214, 232, 255];
      g.fillStyle = `rgba(${r},${gg},${b},${k})`;
      g.fillRect(x + 6, y + 6, 116, 4); // light strip
      const glow = g.createLinearGradient(0, y + 8, 0, y + 50);
      glow.addColorStop(0, `rgba(${r},${gg},${b},${0.35*k})`); glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow; g.fillRect(x, y + 8, 128, 44);
    }
    g.fillStyle = '#000'; for (let x = 0; x < 1024; x += 37) if (rnd() < 0.5) g.fillRect(x, y + 42, 14 + rnd()*10, 18); // furniture silhouettes
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t;
}

// ---------------- ground ----------------
const groundGeo = new THREE.PlaneGeometry(16000, 16000);
groundGeo.attributes.uv.array.forEach((v, i, a) => a[i] = v * 16000 / 4);
groundGeo.setAttribute('uv2', groundGeo.attributes.uv.clone());
const ground = new THREE.Mesh(groundGeo, M.pave);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ---------------- the tower ----------------
const tower = new THREE.Group(); scene.add(tower);
const FOOT = 34; // podium footprint
let Y = 0;
const marks = {}; // label anchor points

// ROOT: Beaux-Arts stone podium (lineage)
(() => {
  for (let s = 0; s < 3; s++) { const st = box(FOOT + 8 - s*2, 0.45, FOOT + 8 - s*2, M.sand, 2.5); st.position.y = 0.225 + s*0.45; tower.add(st); }
  Y = 1.35;
  const base = box(FOOT, 7, FOOT, M.sand, 2.2); base.position.y = Y + 3.5; tower.add(base);
  // rustication grooves
  const groove = inst(new THREE.BoxGeometry(1, 0.12, 1), M.darkMetal, 14);
  for (let i = 0; i < 7; i++) { setI(groove, i*2, 0, Y + 1 + i*0.95, FOOT/2 + 0.01, FOOT, 1, 0.05); setI(groove, i*2+1, FOOT/2 + 0.01, Y + 1 + i*0.95, 0, 0.05, 1, FOOT); }
  tower.add(groove);
  Y += 7;
  const band = box(FOOT + 1.6, 1.1, FOOT + 1.6, M.sand, 2.2); band.position.y = Y + 0.55; tower.add(band); Y += 1.1;
  // recessed wall with tall arched-window light behind colonnade
  const core = box(FOOT - 5, 14, FOOT - 5, M.sand, 2.2); core.position.y = Y + 7; tower.add(core);
  const tall = new THREE.MeshBasicMaterial({ color: 0xffc98a });
  const winR = inst(new THREE.BoxGeometry(1, 1, 1), tall, 24);
  let wi = 0;
  for (const side of [0, 1, 2, 3]) for (let k = 0; k < 6; k++) {
    const u = -11.2 + k*4.5, h = 9, yy = Y + 6;
    const lit = (k + side) % 3 !== 0;
    const sc = lit ? 1 : 0.0001;
    if (side === 0) setI(winR, wi++, u, yy, (FOOT-5)/2 + 0.02, 2.2*sc, h, 0.05);
    if (side === 1) setI(winR, wi++, u, yy, -(FOOT-5)/2 - 0.02, 2.2*sc, h, 0.05);
    if (side === 2) setI(winR, wi++, (FOOT-5)/2 + 0.02, yy, u, 0.05, h, 2.2*sc);
    if (side === 3) setI(winR, wi++, -(FOOT-5)/2 - 0.02, yy, u, 0.05, h, 2.2*sc);
  }
  tower.add(winR);
  // fluted columns
  const colGeo = new THREE.CylinderGeometry(0.78, 0.86, 12.4, 28, 1);
  colGeo.attributes.uv.array.forEach((v, i, a) => { if (i % 2 === 0) a[i] = v * 2; else a[i] = v * 5; });
  colGeo.setAttribute('uv2', colGeo.attributes.uv.clone());
  const cols = inst(colGeo, M.sand, 40);
  const capGeo = new THREE.BoxGeometry(2.2, 0.6, 2.2);
  const caps = inst(capGeo, M.sand, 80);
  let ci = 0;
  for (let k = 0; k < 10; k++) {
    const u = -14.85 + k*3.3;
    for (const [x, z] of [[u, FOOT/2 - 1.2], [u, -FOOT/2 + 1.2], [FOOT/2 - 1.2, u], [-FOOT/2 + 1.2, u]]) {
      setI(cols, ci, x, Y + 6.8, z); setI(caps, ci*2, x, Y + 13.3, z); setI(caps, ci*2+1, x, Y + 0.3, z); ci++;
    }
  }
  tower.add(cols, caps);
  Y += 13.6;
  // entablature + dentils + cornice
  const ent = box(FOOT + 0.4, 2.4, FOOT + 0.4, M.sand, 2.2); ent.position.y = Y + 1.2; tower.add(ent);
  const dent = inst(new THREE.BoxGeometry(0.35, 0.4, 0.5), M.sand, 400);
  let di = 0;
  for (let k = 0; k < 96 && di < 396; k++) { const u = -17 + k*0.36; setI(dent, di++, u, Y + 2.6, FOOT/2 + 0.35); setI(dent, di++, u, Y + 2.6, -FOOT/2 - 0.35); setI(dent, di++, FOOT/2 + 0.35, Y + 2.6, u, 1,1,1, Math.PI/2); setI(dent, di++, -FOOT/2 - 0.35, Y + 2.6, u, 1,1,1, Math.PI/2); }
  dent.count = di; tower.add(dent);
  const cor = box(FOOT + 2.4, 0.9, FOOT + 2.4, M.sand, 2.2); cor.position.y = Y + 3.25; tower.add(cor);
  Y += 3.7;
  marks.root = new THREE.Vector3(FOOT/2 + 2, 12, FOOT/2);
})();

// ERA I: brick, punched windows with stone sills (first merged PRs)
(() => {
  const w = 28, floors = 7, fh = 3.9, y0 = Y;
  const shell = box(w, floors*fh, w, M.brick, 1.4); shell.position.y = y0 + floors*fh/2; tower.add(shell);
  const per = 6, n = floors * per * 4;
  const lit = inst(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), n);
  const dark = inst(new THREE.BoxGeometry(1, 1, 1), M.winGlass, n);
  const reveal = inst(new THREE.BoxGeometry(1, 1, 1), M.darkMetal, n);
  const sill = inst(new THREE.BoxGeometry(1, 1, 1), M.sand, n * 2);
  const pier = inst(new THREE.BoxGeometry(1, 1, 1), M.brick, (per + 1) * 4);
  let li = 0, dk = 0, ri = 0, si = 0;
  seed = 31;
  const col = new THREE.Color();
  for (let f = 0; f < floors; f++) for (let side = 0; side < 4; side++) for (let k = 0; k < per; k++) {
    const u = -w/2 + 2.6 + k*(w - 5.2)/(per - 1), yy = y0 + f*fh + fh*0.52;
    const place = (m, i, du, dy, dn, sw, sh, sd) => {
      const n0 = w/2 + dn;
      if (side === 0) setI(m, i, u + du, yy + dy, n0, sw, sh, sd);
      if (side === 1) setI(m, i, u + du, yy + dy, -n0, sw, sh, sd);
      if (side === 2) setI(m, i, n0, yy + dy, u + du, sd, sh, sw);
      if (side === 3) setI(m, i, -n0, yy + dy, u + du, sd, sh, sw);
    };
    place(reveal, ri++, 0, 0, 0.02, 1.9, 2.5, 0.06);
    if (rnd() < 0.55) {
      place(lit, li, 0, 0, 0.06, 1.55, 2.2, 0.04);
      const k2 = 0.35 + rnd()*0.65; col.setRGB(1.0*k2, 0.72*k2, 0.42*k2); lit.setColorAt(li, col); li++;
    } else place(dark, dk++, 0, 0, 0.06, 1.55, 2.2, 0.04);
    place(sill, si++, 0, -1.35, 0.18, 2.3, 0.22, 0.36);
    place(sill, si++, 0, 1.4, 0.12, 2.3, 0.35, 0.24);
  }
  lit.count = li; dark.count = dk; sill.count = si;
  let pi = 0;
  for (let side = 0; side < 4; side++) for (let k = 0; k <= per; k++) {
    const u = -w/2 + 2.6 - (w - 5.2)/(per - 1)/2 + k*(w - 5.2)/(per - 1);
    const hh = floors*fh, yy = y0 + hh/2, d = w/2 + 0.25;
    if (side === 0) setI(pier, pi++, u, yy, d, 0.6, hh, 0.5);
    if (side === 1) setI(pier, pi++, u, yy, -d, 0.6, hh, 0.5);
    if (side === 2) setI(pier, pi++, d, yy, u, 0.5, hh, 0.6);
    if (side === 3) setI(pier, pi++, -d, yy, u, 0.5, hh, 0.6);
  }
  tower.add(lit, dark, reveal, sill, pier);
  Y = y0 + floors*fh;
  const cap = box(w + 1.6, 1.2, w + 1.6, M.sand, 2.2); cap.position.y = Y + 0.6; tower.add(cap); Y += 1.2;
  marks.brick = new THREE.Vector3(w/2 + 1, y0 + floors*fh/2, w/2);
})();

// ERA II: steel and glass curtain wall (after promotion)
const scarFloor = 5;
(() => {
  const w = 25, floors = 13, fh = 4.0, y0 = Y;
  const coreMat = new THREE.MeshBasicMaterial({ map: interiorTex(floors, true, 0.8, 91) });
  coreMat.map.repeat.set(1, 1);
  const core = new THREE.Mesh(new THREE.BoxGeometry(w - 0.8, floors*fh, w - 0.8), coreMat);
  core.position.y = y0 + floors*fh/2; tower.add(core);
  const skin = new THREE.Mesh(new THREE.BoxGeometry(w, floors*fh, w), M.glass);
  skin.position.y = core.position.y; tower.add(skin);
  // mullions + spandrels
  const mullN = 4 * 17, spN = floors * 4;
  const mull = inst(new THREE.BoxGeometry(1, 1, 1), M.bronze, mullN);
  const sp = inst(new THREE.BoxGeometry(1, 1, 1), M.bronze, spN + 8);
  let mi = 0;
  for (let side = 0; side < 4; side++) for (let k = 0; k < 17; k++) {
    const u = -w/2 + k * w/16, hh = floors*fh, yy = y0 + hh/2, d = w/2 + 0.12;
    if (side === 0) setI(mull, mi++, u, yy, d, 0.12, hh, 0.35);
    if (side === 1) setI(mull, mi++, u, yy, -d, 0.12, hh, 0.35);
    if (side === 2) setI(mull, mi++, d, yy, u, 0.35, hh, 0.12);
    if (side === 3) setI(mull, mi++, -d, yy, u, 0.35, hh, 0.12);
  }
  let si = 0;
  for (let f = 0; f <= floors; f++) {
    const yy = y0 + f*fh, d = w/2 + 0.08;
    setI(sp, si++, 0, yy, d, w + 0.3, 0.7, 0.2); setI(sp, si++, 0, yy, -d, w + 0.3, 0.7, 0.2);
    setI(sp, si++, d, yy, 0, 0.2, 0.7, w + 0.3); setI(sp, si++, -d, yy, 0, 0.2, 0.7, w + 0.3);
  }
  sp.count = si;
  tower.add(mull, sp);
  // the scar: a rejected PR left a patched, mismatched floor (riveted plate, no glass)
  const scar = box(w + 0.5, fh - 0.7, w + 0.5, new THREE.MeshStandardMaterial({ map: M.primer.map, normalMap: M.primer.normalMap, roughnessMap: M.primer.roughnessMap, color: 0x7a4a3c, metalness: 0.4, roughness: 1 }), 2); scar.position.y = y0 + scarFloor*fh + fh/2; tower.add(scar);
  const scarPlate = box(w + 0.7, 0.25, w + 0.7, M.darkMetal); scarPlate.position.y = y0 + scarFloor*fh + 0.4; tower.add(scarPlate);
  marks.glass = new THREE.Vector3(w/2 + 1, y0 + 10*fh, w/2);
  marks.scar = new THREE.Vector3(w/2 + 1, y0 + scarFloor*fh + fh/2, w/2);
  Y = y0 + floors*fh;
  const tr = box(w + 1, 1.4, w + 1, M.darkMetal); tr.position.y = Y + 0.7; tower.add(tr); Y += 1.4;
})();

// ERA III: titanium, twisting (reviewer's way of working)
const twist = 0.035;
let eraIIITop, eraIIIFloors = 16, finishedFloors = 15;
const eraIII = new THREE.Group(); tower.add(eraIII);
const eraIIIFloorGroups = [];
(() => {

// facade material: windows are computed from world position, so every building keeps real window scale
function facadeMat(base, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color: base, metalness: opts.metal ?? 0.55, roughness: opts.rough ?? 0.28 });
  const litFrac = opts.lit ?? 0.42;
  m.onBeforeCompile = sh => {
    sh.uniforms.uLit = { value: litFrac };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN; varying vec3 vSeed;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        mat4 mm = modelMatrix;
        #ifdef USE_INSTANCING
          mm = modelMatrix * instanceMatrix;
        #endif
        vWP = (mm * vec4(transformed, 1.0)).xyz;
        vWN = normalize(mat3(mm) * objectNormal);
        vSeed = mm[3].xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uLit; varying vec3 vWP; varying vec3 vWN; varying vec3 vSeed;
        float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        vec3 an = abs(vWN);
        if (an.y < 0.5) {
          float u = an.x > 0.5 ? vWP.z : vWP.x;
          float bs0 = fract(sin(dot(vSeed.xz, vec2(12.9898, 78.233))) * 43758.5453);
          float fh = 3.4 + bs0*0.8, cw = 1.7 + bs0*1.6;
          vec2 cell = fract(vec2(u / cw, vWP.y / fh));
          vec2 id = floor(vec2(u / cw, vWP.y / fh));
          float win = smoothstep(0.06,0.09,cell.x)*smoothstep(0.94,0.91,cell.x)*smoothstep(0.12,0.16,cell.y)*smoothstep(0.9,0.86,cell.y);
          win *= 1.0 - 0.8*smoothstep(0.47,0.49,cell.x)*smoothstep(0.53,0.51,cell.x); // pane divider
          float bs = h21(vSeed.xz*0.013);
          float floorOn = step(0.25, h21(vec2(id.y, bs*91.0)));        // whole floors dark
          float lit = step(1.0 - uLit, h21(id + bs*57.0)) * floorOn;
          vec3 warm = vec3(1.0, 0.74, 0.45), cool = vec3(0.78, 0.88, 1.0);
          vec3 c = mix(warm, cool, step(0.7, h21(vec2(bs, id.y))));
          float k = 0.25 + 0.75*pow(h21(id*1.7 + bs), 2.0);
          float blind = 0.55 + 0.45*smoothstep(0.3, 0.9, cell.y);   // blinds and ceiling falloff
          totalEmissiveRadiance += win * lit * c * k * blind * 1.1;
          diffuseColor.rgb *= mix(1.0, 0.45, win);                       // glass darker than spandrel
        }`);
  };
  return m;
}

  el.innerHTML = `<b></b><i></i><div><em>${a}</em><span>${b}</span></div>`;
  document.getElementById('labels').appendChild(el); return { k, el };
});
let showLabels = true;
addEventListener('keydown', e => { if (e.key === 'l' || e.key === 'L') { showLabels = !showLabels; } });
const tmpV = new THREE.Vector3();
function placeLabels() {
  for (const { k, el } of labelEls) {
    tmpV.copy(marks[k]); tower.localToWorld(tmpV);
    const camDir = tmpV.clone().sub(camera.position);
    tmpV.project(camera);
    const vis = showLabels && tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    el.style.opacity = vis ? 1 : 0;
    el.style.left = ((tmpV.x + 1)/2*W()) + 'px'; el.style.top = ((1 - tmpV.y)/2*H()) + 'px';
  }
}

// ---------------- construction state machine ----------------
const stageBtns = [...document.querySelectorAll('#dock button')];
let stage = 0, stageT = 0, auto = true;
const DUR = [5, 9, 7, 7];
stageBtns.forEach(b => b.onclick = () => { stage = +b.dataset.s; stageT = 0; auto = true; });
function applyStage(dt, t) {
  stageT += dt;
  if (auto && stageT > DUR[stage]) { stage = (stage + 1) % 4; stageT = 0; }
  const p = Math.min(stageT / DUR[stage], 1);
  stageBtns.forEach((b, i) => { b.classList.toggle('on', i === stage); b.querySelector('.bar').style.width = (i === stage ? p*100 : i < stage ? 100 : 0) + '%'; });
  const framing = stage === 1 ? p : stage >= 2 ? 1 : 0.08;
  skCols.count = Math.ceil(colPts.length * Math.min(framing * 1.6, 1));
  skBeams.count = Math.floor(beamDefs.length * Math.max(0, framing * 1.4 - 0.4));
  const cured = stage === 3;
  eraIIIFloorGroups[15].visible = cured && p > 0.15;
  site.visible = !(cured && p > 0.15);
  net.visible = stage === 1 || stage === 2;
  // crane: slew between pickup and the frame; load rises during framing
  const targetAng = stage === 0 ? 2.2 : stage === 1 ? 0.6 + Math.sin(t*0.25)*0.5 : stage === 2 ? -0.4 : -1.2;
  slew.rotation.y += (targetAng - slew.rotation.y) * Math.min(dt*0.6, 1);
  const drop = stage === 1 ? 6 + (1 - (Math.sin(t*0.4)*0.5 + 0.5))*22 : 4;
  cableMesh.scale.y = drop; cableMesh.position.y = -drop/2; hook.position.y = -drop;
  // sparks during framing
  const welding = stage === 1;
  for (let i = 0; i < SPARKS; i++) {
    sl[i] -= dt;
    if (sl[i] <= 0) { if (welding) respawn(i, weldPts[i % 3]); else { sp[i*3+1] = -999; continue; } }
    sv[i*3+1] -= 9.8*dt; sp[i*3] += sv[i*3]*dt; sp[i*3+1] += sv[i*3+1]*dt; sp[i*3+2] += sv[i*3+2]*dt;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  const flick = welding ? (Math.random() < 0.5 ? 0 : 400 + Math.random()*900) : 0;
  weldLight.intensity = flick; weldLight.position.set(...weldPts[Math.floor(t*0.7) % 3]);
  // inspection beams
  const on = stage === 2 ? Math.min(p*4, 1) * Math.min((1 - p)*6, 1) : 0;
  beamMat.uniforms.uOn.value = on;
  const aim = new THREE.Vector3();
  searchers.forEach((s, i) => {
    aim.set(Math.sin(t*0.6 + s.phase)*8, conY + fhIII + Math.cos(t*0.5 + s.phase)*3, Math.cos(t*0.7 + s.phase)*8);
    s.sl.target.position.copy(aim); s.sl.intensity = on * 6e4;
    const dir = aim.clone().sub(s.base); const len = dir.length();
    s.cone.position.copy(s.base); s.cone.lookAt(aim); s.cone.scale.set(1, 1, len);
    s.cone.visible = on > 0.01;
  });
  const liveEl = labelEls.find(l => l.k === 'live').el;
  const liveTxt = cured && p > 0.15 ? ['Floor 16 cured', 'PR #318 merged, passed inspection'] : stage === 2 ? ['Inspection', 'tests, build and design check running'] : ['Under construction', 'issue #318, won at $4.20 against 3 bids'];
  if (liveEl.dataset.t !== liveTxt[0]) { liveEl.dataset.t = liveTxt[0]; liveEl.querySelector('em').textContent = liveTxt[0]; liveEl.querySelector('span').textContent = liveTxt[1]; }
  // cured: windows bloom on the new floor
  if (cured) eraIIIFloorGroups[15].children[1].material.color.setScalar(Math.min(p*3, 1));
  beaconLight.intensity = (Math.sin(t*3) > 0.6) ? 40 : 0;
  beacon.material.color.setRGB(Math.sin(t*3) > 0.6 ? 1 : 0.25, 0.05, 0.02);
}

// ---------------- loop ----------------
addEventListener('resize', () => {
  camera.aspect = W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(), H()); composer.setSize(W(), H());
});
renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  applyStage(dt, t);
  controls.update();
  if (camera.position.y < 1.7) camera.position.y = 1.7;
  composer.render();
  placeLabels();
});
window.__ao = on => { if (gtao) gtao.enabled = on; };
window.__stage = s => { stage = s; stageT = DUR[s]*0.5; auto = false; };
window.__cam = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.autoRotate = false; controls.update(); };
</script>
</body>
